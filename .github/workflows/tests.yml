name: Mutation & Quality

# Workflow de verificación profunda de calidad:
#   - pytest con cobertura sobre motor/
#   - mypy (gate de tipos, nivel básico verificado)
#   - mutation testing (pytest-gremlins) con umbral dinámico 90→95→100
#     (mutmut retirado 2026-08-21: TASK-20260821-002; gate mutmut legacy en
#      scripts/run_mutation_tests.sh se conserva como referencia)
#   - semgrep (SAST rápido)
#
# Ejecuta en: push a main, PRs, y programado (nightly).
# El job `mutation` solo corre en push a main y schedule (no en PRs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -e ".[dev]"
          pip install pytest-gremlins sounddevice librosa ffmpeg-python
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper
      - name: Cobertura unitaria (motor, informativa — no bloqueante)
        # NOTA: corre SOLO tests/unit/ (subset). El porcentaje global
        # subestima la cobertura real del núcleo: cada módulo se mide con
        # sus tests dedicados (--source relativo al módulo, política AGENTS.md).
        # Este job es informativo; el gate real de cobertura es cobertura-nuevos.
        run: pytest tests/unit/ -q --tb=short --cov=motor --cov-report=term-missing || true

  integracion:
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Contratos de API + E2E + rendimiento (smoke)
        run: |
          pytest tests/integration/test_contracts.py tests/integration/test_e2e.py \
            tests/performance/ -q --tb=short

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]" "mypy>=2.3"
      - name: Gate de tipos (mypy.ini strict — falla si hay errores)
        run: mypy --no-incremental motor/ knowledge/engine/rules.py knowledge/engine/graphrag.py

  mutation:
    runs-on: ubuntu-latest
    needs: [coverage, mypy]
    # Solo en push a main y schedule (nightly), NO en PRs: el gate de
    # mutación tarda (timeout 3600s) y no forma parte de los status checks
    # obligatorios de la protección de main (lint/test). Correrlo en cada PR
    # solo añade espera y a veces queda en None sin bloquear nada.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -e ".[dev]"
          pip install pytest-gremlins pytest-rerunfailures pytest-timeout pytest-instafail
      - name: Mutation testing (pytest-gremlins, umbral dinámico)
        env:
          PYTEST_GREMLINS_MAP_TIMEOUT: "3600"
        run: scripts/run_mutation_tests_gremlins.sh
      - name: Subir reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-report
          path: |
            docs/udo/mutation-survivors/
            docs/udo/mutation_dashboard.md

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar semgrep
        run: pip install semgrep
      - name: Semgrep (reglas locales .semgrep.yml; fail solo en críticas)
        run: |
          semgrep --config .semgrep.yml --error --severity ERROR . || \
            (echo "semgrep: hallazgos críticos (revisar)" && exit 1)
