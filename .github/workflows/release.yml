name: Release v6.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v6.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Pre-release validation gates
  validate:
    name: Pre-release validation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      
      - name: Install dependencies
        run: pip install -e ".[dev]"
      
      - name: Ruff lint
        run: ruff check . --output-format=concise
      
      - name: Mypy type check
        run: mypy --no-incremental --exclude motor/tests core motor shared
      
      - name: Core tests (unit + integration)
        run: pytest tests/integration/test_degraded_mode.py tests/unit/test_motor_plugin_registry_v2.py tests/unit/test_subprocess_executor.py tests/unit/test_motor_cli_main.py tests/unit/test_motor_config_cobertura.py -q --tb=short
      
      - name: Contract tests
        run: pytest tests/contracts/test_llm_contract.py -q --tb=short
      
      - name: Security audit (secrets + deps)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          python3 scripts/pro/audit_secrets.py --fail-critical

  # Build wheel and sdist
  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build distributions
        run: python -m build
      
      - name: Verify distributions
        run: twine check dist/*
      
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Generate changelog from git history
  changelog:
    name: Generate changelog
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.generate.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate changelog from tags
        id: generate
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF_NAME}
          
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "Generating changelog from $PREV_TAG to $CURRENT_TAG"
          
          # Generate changelog grouped by type
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD | head -100)
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # Create GitHub Release
  release:
    name: Create GitHub Release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: ${{ needs.changelog.outputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ramon-kaixo'
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  # Post-release smoke tests
  smoke:
    name: Post-release smoke tests
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install released package
        run: pip install ura-platform==${GITHUB_REF_NAME#v}
      
      - name: Smoke test CLI
        run: |
          ura --help
          ura status
      
      - name: Verify imports
        run: |
          python -c "import ura; import motor; print('Imports OK')"
        working-directory: /tmp

  # Post-release notification
  notify:
    name: Notify completion
    needs: [publish, smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify success
        if: success()
        run: |
          echo "✅ Release ${{ github.ref_name }} published successfully!"
          echo "📦 PyPI: https://pypi.org/project/ura-platform/${{ github.ref_name#v }}/"
          echo "📝 Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Release ${{ github.ref_name }} failed!"
          echo "Check workflow logs for details."

