name: cobertura-nuevos

on:
  push:
    branches: [main, mac-veredictos]
  pull_request:

jobs:
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install coverage pytest
      - name: Verificar cobertura de módulos del diff (gate 85%, meta 100)
        run: python3 scripts/pro/verificador_cobertura.py --ci --base origin/main --min 85