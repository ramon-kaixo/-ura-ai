name: CI
on:
  push:
    branches: [main, dev/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check . --output-format=concise
      - name: Ruff format check
        run: ruff format --check .

  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest motor/tests/ -q --tb=short

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest motor/tests/e2e/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SCA — pip-audit sobre requirements.txt
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: SAST — secretos en historial git (patrones fuertes)
        run: python3 scripts/pro/audit_git_secrets.py --fail --max-commits 300
      - name: SAST — secretos hardcodeados en código (fail solo críticos)
        run: python3 scripts/pro/audit_secrets.py --fail-critical

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Reporte de cobertura (motor, informativo — sin umbral bloqueante)
        run: pytest motor/tests/ -q --tb=short --cov=motor --cov-report=term-missing
