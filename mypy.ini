[mypy]
python_version = 3.12
# Nivel base ENFORZADO en CI (verificado 2026-08-21: 0 errores en 63 ficheros):
check_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True

# ── ROADMAP STRICT (CIERRE-20260821, Fase 5 — NO ejecutado por coste) ──
# Medido 2026-08-21 con strict en motor/core/fusion + motor/core/llm/base
# + motor/assistant: 228 errores en 66 ficheros (113 type-arg, 53
# no-untyped-def, 20 no-any-return, 19 no-untyped-call, 7 attr-defined...).
# Estimacion: 4-8h. Plan por fases (ejecutar con TASK propia):
#
#   Fase A (type-arg, ~113): anotar genericos (list[X]/dict[K,V]) en los
#     ficheros de entrada: motor/core/qdrant_client.py, motor/core/llm/*,
#     knowledge/engine/rules.py, knowledge/engine/graphrag.py, motor/memory/
#   Fase B (no-untyped-def, ~53): firmas de funciones en motor/assistant/*
#     (los ficheros strict importan codigo legacy no anotado -> cascada;
#     anotar de abajo arriba elimina el ruido transitivo)
#   Fase C (no-any-return/no-untyped-call/attr-defined, ~46): retornos
#     explicitos, casts puntuales, unused-ignore de limpieza
#   Cierre: activar las secciones [mypy-motor.*] strict=True de abajo
#   (descomentar este bloque) y mover el gate del CI al modo strict.
#
# Activacion (FASE B ejecutada 2026-08-22):
[mypy-motor.core.fusion.*]
strict = True

[mypy-motor.core.llm.base]
strict = True

[mypy-motor.assistant.*]
strict = True

# ── ROADMAP STRICT — Fases A/B/C ejecutadas (TASK-20260825-009) ──
# Medicion 2026-08-21: 228 errores. Auditado 2026-08-25: 9 errores reales
# (el codigo mejoro). Corregidos los 9 (type-arg, no-untyped-def,
# no-untyped-call, no-any-return) en motor/intelligence/. Strict activado:
[mypy-motor.intelligence.*]
strict = True

[mypy-motor.memory.*]
strict = True

[mypy-motor.core.qdrant_client]
strict = True

[mypy-motor.core.llm.*]
strict = True

[mypy-knowledge.engine.rules]
strict = True

[mypy-knowledge.engine.graphrag]
strict = True

# motor/memory/crypto.py: usa cryptography opcional (try/except ImportError).
# Sus firmas tipan Any cuando la libreria no esta tipada en el entorno CI.
# warn_unused_ignores varia segun si cryptography esta instalado/tipado,
# asi que se desactiva para este modulo y los # type: ignore cubren ambos casos.
[mypy-motor.memory.crypto]
warn_unused_ignores = False

# Workaround bug mypy 1.18.2: onnx_ir._core tiene una Var anotada con
# TypeGuard que mypy no puede serializar al escribir cache (crash
# "Cannot serialize TypeGuardedType"). Codigo de terceros, fuera de scope:
# se excluye del analisis profundo (los imports resuelven a Any).
[mypy-onnx_ir.*]
follow_imports = skip
ignore_missing_imports = True
