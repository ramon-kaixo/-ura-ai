[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ura*", "motor*", "core*", "monitor*", "knowledge*", "scripts*"]
exclude = ["tests*", "motor/tests*"]

[project]
name = "ura"
version = "0.29.0"
description = "URA — Multi-agent desktop assistant with retrieval, memory, and multi-agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ramon Esnaola"},
]

dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "qdrant-client>=1.9.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "prometheus-client>=0.19.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "pytest-randomly>=4.0",
    "pytest-deadfixtures>=2.0",
    "pytest-snapshot>=0.9",
    "pytest-rerunfailures>=14.0",
    "radon>=6.0",
    "xenon>=0.9",
    "hypothesis>=6.0",
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "pytest-randomly>=4.0",
    "pytest-deadfixtures>=2.0",
    "pytest-snapshot>=0.9",
    "pytest-rerunfailures>=14.0",
    "radon>=6.0",
    "xenon>=0.9",
    "hypothesis>=6.0",
    "aiohttp>=3.9",
    "ruff==0.15.18",
]

[project.scripts]
ura = "ura:main"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/", "motor/tests/", "mantenimiento/", "deploy/mac/plan_fondo.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "D", "BLE001", "ARG", "G004", "PLR2004", "PLR0913", "E402",
    "EXE001", "EXE002",
    "PLC0415", "FBT", "PLW0108", "E741", "ERA", "N", "PT", "PERF401",
    "TC001", "TC003", "TRY", "EM", "PIE", "RET", "T20", "COM", "Q",
    "S603", "S607", "ASYNC210", "C901", "PLR0912", "PLR0911", "S112",
    "SLF001", "E501", "S108", "CPY",
    "PLR0917",  # consistente con PLR0913 (demasiados argumentos): firmas legacy estables
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN", "ARG", "SLF001", "S105", "INP001", "TC002"]
"scripts/*" = ["INP001"]  # scripts autónomos sin __init__.py (namespace por diseño)
"scripts/pro/tests/*" = ["S101", "D", "ANN", "ARG", "SLF001"]
"motor/tests/*" = ["S101", "D", "ANN", "ARG", "SLF001"]
"docs/merge_resolution/*" = ["S101", "S110", "INP001"]  # tests documentales de resolución de merges

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow",
    "integration: approval tests against live endpoints",
    "unit: tests unitarios aislados",
    "smoke: tests de import/happy path generados por plantilla",
    "hypothesis: tests property-based generados por plantilla",
    "performance: tests de latencia de endpoints (smoke)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".hypothesis", ".git", ".venv", "venv", "__pycache__", "audit_reports", ".nervioso", ".sandbox_packages"]
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 60
asyncio_mode = "auto"
addopts = "--reruns 2 --reruns-delay 1 --strict-markers --instafail"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "core.mochila.providers.*"
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = "motor.tests.*"
ignore_errors = true

[tool.tuneladora.shadow]
layers = [0, 1, 2, 3, 4, 5, 6, 7]
timeout_layer_0 = 10
timeout_layer_1 = 300
timeout_layer_2 = 600
timeout_layer_3 = 120
cache_ttl = 300
fail_fast = true
json_output = false

[tool.tuneladora]
review-model = "qwen3:32b-q8_0"
llm-fallback-model = "qwen2.5-coder:14b"
unsafe-fixes = false
strict-warnings = false
auto-commit = true
max-snapshots = 30
timeout-ruff = 300
timeout-llm = 120
timeout-worker = 3600
timeout-script = 120
sandbox-cpu-sec = 300
sandbox-max-mem-mb = 2048
test-target = "tests/"
pytest-socket-disable = false
ollama-host = "localhost"
ollama-port = "11434"
llm-retries = 2
auto-trigger-mode = "gate"
auto-trigger-strict = true

# [tool.mutmut] LEGACY (retirado 2026-08-21, TASK-20260821-002): sustituido por
# pytest-gremlins + gate scripts/run_mutation_tests_gremlins.sh. Se conserva como
# referencia histórica; el CI ya no lo ejecuta (ver .github/workflows/tests.yml).

[tool.mutacion]
# Config del gate de mutación URA (pytest-gremlins). Consumida por
# scripts/run_mutation_tests_gremlins.sh. Umbral dinámico: docs/udo/mutation_threshold.json
targets = [
    "core/guardian_disco.py",
    "core/stealth_fetcher.py",
    "core/guardians/ast_sentinel.py",
    "core/path_setup.py",
    "core/mochila/status_endpoint.py",
    "core/mochila/vram_scheduler.py",
    "core/mochila/providers/base.py",
    "core/mochila/tools.py",
]
tests = [
    "tests/unit/test_ast_sentinel.py",
    "tests/unit/test_cold_refactor.py",
    "tests/unit/test_core_guardians_mochila_cobertura.py",
    "tests/unit/test_guardian_disco.py",
    "tests/unit/test_guardian_middleware_path.py",
    "tests/unit/test_mochila_adapter_cobertura.py",
    "tests/unit/test_mochila_infra.py",
    "tests/unit/test_mochila_provider_ollama.py",
    "tests/unit/test_mochila_providers_clonados.py",
    "tests/unit/test_mochila_providers_openrouter_gemini.py",
    "tests/unit/test_mochila_routes_models_status.py",
    "tests/unit/test_mochila_vram_scheduler.py",
    "tests/unit/test_path_setup.py",
    "tests/unit/test_stealth_fetcher.py",
    "tests/unit/test_mochila_tools_cobertura.py",
]
executor = "subprocess"
map_timeout_env = "PYTEST_GREMLINS_MAP_TIMEOUT"
report_json = "coverage/gremlins/gremlins.json"
dashboard_script = "scripts/update_mutation_dashboard.py"
survivor_analyzer = "scripts/analyze_survivors.py"

[tool.mutmut]
source_paths = ["motor/core/", "motor/intelligence/", "core/", "knowledge/"]
do_not_mutate = ["*/motor/core/voice/*", "*/knowledge/engine/extractors/audio/*", "*voice*", "*extractors/audio*", "*/knowledge/engine/extractors/git.py", "*/knowledge/engine/archiver.py", "*/knowledge/engine/jobs.py"]
also_copy = ["motor/tests/", "config/", "scripts/pro/", "scripts/", "schemas/", "AGENTS.md", "docs/udo/"]
pytest_add_cli_args = [
    # mutmut hardcodea -x; maxfail posterior lo anula y permite que la fase de
    # stats tolere tests flaky dependientes de orden (p.ej. tests con git real).
    "--maxfail=20",
    "--ignore=tests/unit/test_knowledge_extractors_git_cobertura.py",
    "--ignore=tests/unit/test_knowledge_jobs_cobertura.py",
    "--ignore=tests/unit/test_udo_protocol_dispatch.py",
