[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ura*", "motor*", "core*", "monitor*", "knowledge*", "scripts*"]
exclude = ["tests*", "motor/tests*"]

[project]
name = "ura"
version = "0.29.0"
description = "URA — Multi-agent desktop assistant with retrieval, memory, and multi-agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ramon Esnaola"},
]

dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "qdrant-client>=1.9.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "prometheus-client>=0.19.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "pytest-randomly>=4.0",
    "pytest-deadfixtures>=2.0",
    "pytest-snapshot>=0.9",
    "pytest-rerunfailures>=14.0",
    "radon>=6.0",
    "xenon>=0.9",
    "hypothesis>=6.0",
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "pytest-randomly>=4.0",
    "pytest-deadfixtures>=2.0",
    "pytest-snapshot>=0.9",
    "pytest-rerunfailures>=14.0",
    "radon>=6.0",
    "xenon>=0.9",
    "hypothesis>=6.0",
    "aiohttp>=3.9",
    "ruff==0.15.18",
]

[project.scripts]
ura = "ura:main"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["agent_hierarchy.py", "agents/sandbox/", "app/", "core/", "scripts/", "knowledge/", "monitor/", "motor/agents/", "motor/cli/", "tests/", "motor/tests/", "motor/health_monitor.py", "motor/assistant/api/routes.py", "sandbox/", "scraping/", "mantenimiento/", "deploy/mac/plan_fondo.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "D", "BLE001", "ARG", "G004", "PLR2004", "PLR0913", "E402",
    "EXE001", "EXE002",
    "PLC0415", "FBT", "PLW0108", "E741", "ERA", "N", "PT", "PERF401",
    "TC001", "TC003", "TRY", "EM", "PIE", "RET", "T20", "COM", "Q",
    "S603", "S607", "ASYNC210", "C901", "PLR0912", "PLR0911", "S112",
    "SLF001", "E501", "S108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN", "ARG", "SLF001", "S105", "INP001", "TC002"]
"scripts/pro/tests/*" = ["S101", "D", "ANN", "ARG", "SLF001"]
"motor/tests/*" = ["S101", "D", "ANN", "ARG", "SLF001"]
"docs/merge_resolution/*" = ["S101", "S110", "INP001"]  # tests documentales de resolución de merges

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow", "integration: approval tests against live endpoints"]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".hypothesis", ".git", ".venv", "venv", "__pycache__", "audit_reports", ".nervioso", ".sandbox_packages"]
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 60
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true

[tool.tuneladora.shadow]
layers = [0, 1, 2, 3, 4, 5, 6, 7]
timeout_layer_0 = 10
timeout_layer_1 = 300
timeout_layer_2 = 600
timeout_layer_3 = 120
cache_ttl = 300
fail_fast = true
json_output = false

[tool.tuneladora]
review-model = "qwen3:32b-q8_0"
llm-fallback-model = "qwen2.5-coder:14b"
unsafe-fixes = false
strict-warnings = false
auto-commit = true
max-snapshots = 30
timeout-ruff = 300
timeout-llm = 120
timeout-worker = 3600
timeout-script = 120
sandbox-cpu-sec = 300
sandbox-max-mem-mb = 2048
test-target = "tests/"
pytest-socket-disable = false
ollama-host = "localhost"
ollama-port = "11434"
llm-retries = 2
auto-trigger-mode = "gate"
auto-trigger-strict = true

[tool.mutmut]
source_paths = ["motor/core/", "motor/intelligence/", "core/", "knowledge/"]
also_copy = ["motor/tests/", "config/"]
