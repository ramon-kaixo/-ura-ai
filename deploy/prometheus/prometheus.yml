global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'ura-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9090']

  - job_name: 'ura-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9091']

  - job_name: 'ura-contraste'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8002']

  - job_name: 'ura-executor'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4096']

  - job_name: 'ura-model-router'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:11435']

  # ura-audit-api (5053) NO expone /metrics (P5 — pendiente instrumentar)
  # ura-openclaw (18789) retirado 2026-08-08 — no scrapear

  - job_name: 'ura-node'
    metrics_path: /metrics
    static_configs:
      - targets: ['node-exporter:9100']