global:
  resolve_timeout: 5m
  smtp_smarthost: ''  # configurar si se desea email (PENDIENTE)
  smtp_from: ''

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-ura'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'webhook-ura'
      repeat_interval: 1h

receivers:
  - name: 'webhook-ura'
    webhook_configs:
      # Endpoint local para integración futura (Telegram/Pushover via core/notifier.py
      # o n8n). Sin destino configurado: las alertas quedan visibles en el UI de
      # Alertmanager y listas para conectar un webhook real.
      - url: 'http://host.docker.internal:5678/webhook/ura-alerts'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['job']