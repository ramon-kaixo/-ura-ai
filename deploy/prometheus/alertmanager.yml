global:
  resolve_timeout: 5m
  smtp_smarthost: ''  # configurar si se desea email (PENDIENTE)
  smtp_from: ''

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-ura'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'webhook-ura'
      repeat_interval: 1h

receivers:
  - name: 'webhook-ura'
    webhook_configs:
      # Webhook propio (ura-alerts-webhook, 9105) -> Telegram/Pushover via
      # motor.core.notifier. Si no hay secretos configurados, degrada con log.
      - url: 'http://webhook-alerts:9105/webhook/ura-alerts'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['job']