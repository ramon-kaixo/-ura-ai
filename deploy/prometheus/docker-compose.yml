services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ura-prometheus-f8
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=:9090'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - '127.0.0.1:9094:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules:/etc/prometheus/alert.rules:ro
      - prometheus-data-f8:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ura-alertmanager-f8
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '127.0.0.1:9095:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ura-grafana-f8
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ura-grafana-2026
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3000
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - grafana-data-f8:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  webhook-alerts:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    container_name: ura-alerts-webhook-f8
    restart: unless-stopped
    ports:
      - '127.0.0.1:9105:9105'
    volumes:
      - ./webhook-alerts.py:/app/webhook-alerts.py:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ura-node-exporter-f8
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    ports:
      - '127.0.0.1:9100:9100'
    volumes:
      - /:/host:ro,rslave

volumes:
  prometheus-data-f8:
  grafana-data-f8: