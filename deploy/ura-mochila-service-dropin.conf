# Drop-in para ura-mochila.service — inyectar URA_API_KEY via entorno
# Instalar:
#   sudo mkdir -p /etc/systemd/system/ura-mochila.service.d
#   KEY=$(python3 -c "from motor.core.secrets import _clear_cache,get_secret; _clear_cache(); print(get_secret('URA_API_KEY'))")
#   echo "[Service]" | sudo tee /etc/systemd/system/ura-mochila.service.d/ura-api-key.conf
#   echo "Environment=URA_API_KEY=$KEY" | sudo tee -a /etc/systemd/system/ura-mochila.service.d/ura-api-key.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ura-mochila
#
# Alternativa: mantener URA_API_KEY en /etc/ura/secrets.env con permiso 644
# (secrets.py lee el archivo pero con cache permanente; restart del servicio lo refresca)

[Service]
Environment=URA_API_KEY=__REEMPLAZAR_CON_KEY_REAL__
